# Federated Operation Debug Configuration

log4j.rootLogger=WARN,console

# General SystemDS logging
log4j.logger.org.apache.sysds=WARN
log4j.logger.org.apache.sysds.utils.SettingsChecker=WARN

# Federated instruction execution logging
log4j.logger.org.apache.sysds.runtime.instructions.fed=DEBUG
log4j.logger.org.apache.sysds.runtime.instructions.fed.FEDInstruction=DEBUG

# Federated infrastructure logging
log4j.logger.org.apache.sysds.runtime.controlprogram.federated=DEBUG
log4j.logger.org.apache.sysds.runtime.controlprogram.federated.FederatedWorkerHandler=TRACE
log4j.logger.org.apache.sysds.runtime.controlprogram.federated.FederatedLoggingUtils=DEBUG

# Federated planning logging
log4j.logger.org.apache.sysds.hops.fedplanner=DEBUG
log4j.logger.org.apache.sysds.hops.fedplanner.FederatedPlanCostEnumerator=DEBUG

# Federated statistics
log4j.logger.org.apache.sysds.utils.stats.FederatedStatistics=DEBUG

# External libraries
log4j.logger.org.apache.spark=ERROR
log4j.logger.org.apache.hadoop=OFF
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=INFO

# Console appender with detailed pattern for debugging
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%t] %-5p %c{1} - %m%n

# File appender for federated operations (optional)
#log4j.appender.fedfile=org.apache.log4j.RollingFileAppender
#log4j.appender.fedfile.File=systemds-federated.log
#log4j.appender.fedfile.MaxFileSize=10MB
#log4j.appender.fedfile.MaxBackupIndex=3
#log4j.appender.fedfile.layout=org.apache.log4j.PatternLayout
